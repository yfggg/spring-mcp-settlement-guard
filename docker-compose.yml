services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-settlement-postgres
    environment:
      POSTGRES_DB: mcpguard
      POSTGRES_USER: mcpguard
      POSTGRES_PASSWORD: mcpguard_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpguard -d mcpguard"]
      interval: 5s
      timeout: 3s
      retries: 10
